services:
  mysql-primary:
    image: mysql:8.0
    container_name: seckill_mysql_primary
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    environment:
      MYSQL_ROOT_PASSWORD: 418124
      MYSQL_DATABASE: seckill_db
    volumes:
      - ./infra/mysql/primary/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p418124"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-replica:
    image: mysql:8.0
    container_name: seckill_mysql_replica
    command:
      - --server-id=2
      - --relay-log=relay-bin
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    environment:
      MYSQL_ROOT_PASSWORD: 418124
      MYSQL_DATABASE: seckill_db
    ports:
      - "3308:3306"
    depends_on:
      mysql-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p418124"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-replica-init:
    image: mysql:8.0
    container_name: seckill_mysql_replica_init
    depends_on:
      mysql-primary:
        condition: service_healthy
      mysql-replica:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: 418124
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: replicator123
    volumes:
      - ./infra/mysql/scripts/setup-replica.sh:/setup-replica.sh:ro
    entrypoint: ["/bin/sh", "/setup-replica.sh"]

  redis:
    image: redis:alpine
    container_name: seckill_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: seckill_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 127.0.0.1 2181 | grep Mode >/dev/null || exit 1"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 12

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: seckill_kafka
    ports:
      - "9092:29092"
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  shardingsphere-proxy:
    build: ./infra/shardingsphere
    container_name: seckill_shardingsphere_proxy
    ports:
      - "3309:3307"
    depends_on:
      mysql-primary:
        condition: service_healthy

  user_service:
    build: ./user_service
    container_name: seckill_user
    environment:
      DATABASE_URL: mysql+pymysql://root:418124@mysql-primary:3306/seckill_db
      SECRET_KEY: fallback_secret_key_for_dev
      JWT_SECRET_KEY: fallback_secret_key_for_dev
      AVATAR_UPLOAD_DIR: /app/uploads
    volumes:
      - avatar_uploads:/app/uploads
    depends_on:
      mysql-primary:
        condition: service_healthy

  product_service_1:
    build: ./product_service
    container_name: seckill_product_1
    environment:
      DATABASE_URL: mysql+pymysql://root:418124@mysql-primary:3306/seckill_db
      READ_DATABASE_URL: mysql+pymysql://root:418124@mysql-replica:3306/seckill_db
      REDIS_HOST: redis
      ENABLE_PRODUCT_CACHE: "true"
      ENABLE_READ_REPLICA: "true"
    depends_on:
      redis:
        condition: service_healthy
      mysql-primary:
        condition: service_healthy
      mysql-replica-init:
        condition: service_completed_successfully

  product_service_2:
    build: ./product_service
    container_name: seckill_product_2
    environment:
      DATABASE_URL: mysql+pymysql://root:418124@mysql-primary:3306/seckill_db
      READ_DATABASE_URL: mysql+pymysql://root:418124@mysql-replica:3306/seckill_db
      REDIS_HOST: redis
      ENABLE_PRODUCT_CACHE: "true"
      ENABLE_READ_REPLICA: "true"
    depends_on:
      redis:
        condition: service_healthy
      mysql-primary:
        condition: service_healthy
      mysql-replica-init:
        condition: service_completed_successfully

  order_service:
    build: ./order_service
    container_name: seckill_order_service
    environment:
      ORDER_DATABASE_URL: mysql+pymysql://root:root@shardingsphere-proxy:3307/order_db?charset=utf8mb4
      PRODUCT_DATABASE_URL: mysql+pymysql://root:418124@mysql-primary:3306/seckill_db?charset=utf8mb4
      INVENTORY_SERVICE_URL: http://inventory_service:8000
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET_KEY: fallback_secret_key_for_dev
      ENABLE_KAFKA_ASYNC: "true"
      ENABLE_ORDER_OUTBOX: "true"
    depends_on:
      redis:
        condition: service_healthy
      mysql-primary:
        condition: service_healthy
      shardingsphere-proxy:
        condition: service_started
      kafka:
        condition: service_healthy

  order_worker:
    build: ./order_service
    container_name: seckill_order_worker
    command: ["python", "-m", "app.worker"]
    environment:
      ORDER_DATABASE_URL: mysql+pymysql://root:root@shardingsphere-proxy:3307/order_db?charset=utf8mb4
      PRODUCT_DATABASE_URL: mysql+pymysql://root:418124@mysql-primary:3306/seckill_db?charset=utf8mb4
      INVENTORY_SERVICE_URL: http://inventory_service:8000
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET_KEY: fallback_secret_key_for_dev
      ENABLE_KAFKA_ASYNC: "true"
      ENABLE_ORDER_OUTBOX: "true"
    depends_on:
      redis:
        condition: service_healthy
      mysql-primary:
        condition: service_healthy
      shardingsphere-proxy:
        condition: service_started
      kafka:
        condition: service_healthy
      inventory_service:
        condition: service_started

  inventory_service:
    build: ./inventory_service
    container_name: seckill_inventory_service
    environment:
      INVENTORY_DATABASE_URL: mysql+pymysql://root:418124@mysql-primary:3306/inventory_db?charset=utf8mb4
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ENABLE_REDIS_STOCK_RESERVATION: "true"
      ENABLE_INVENTORY_OUTBOX: "true"
    depends_on:
      redis:
        condition: service_healthy
      mysql-primary:
        condition: service_healthy
      kafka:
        condition: service_healthy

  inventory_worker:
    build: ./inventory_service
    container_name: seckill_inventory_worker
    command: ["python", "-m", "app.worker"]
    environment:
      INVENTORY_DATABASE_URL: mysql+pymysql://root:418124@mysql-primary:3306/inventory_db?charset=utf8mb4
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ENABLE_REDIS_STOCK_RESERVATION: "true"
      ENABLE_INVENTORY_OUTBOX: "true"
    depends_on:
      redis:
        condition: service_healthy
      mysql-primary:
        condition: service_healthy
      kafka:
        condition: service_healthy

  frontend_nginx:
    build: ./frontend
    container_name: seckill_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user_service
      - product_service_1
      - product_service_2
      - order_service

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: seckill_prometheus
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./performance/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./performance/monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --web.enable-lifecycle
    depends_on:
      - redis_exporter
      - mysqld_exporter
      - mysqld_replica_exporter
      - kafka_exporter
      - cadvisor
      - business_exporter

  grafana:
    image: grafana/grafana:11.2.0
    container_name: seckill_grafana
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./performance/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./performance/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  redis_exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: seckill_redis_exporter
    profiles: ["monitoring"]
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  mysqld_exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: seckill_mysqld_exporter
    profiles: ["monitoring"]
    environment:
      MYSQLD_EXPORTER_PASSWORD: "418124"
    command:
      - --mysqld.address=mysql-primary:3306
      - --mysqld.username=root
    depends_on:
      mysql-primary:
        condition: service_healthy

  mysqld_replica_exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: seckill_mysqld_replica_exporter
    profiles: ["monitoring"]
    environment:
      MYSQLD_EXPORTER_PASSWORD: "418124"
    command:
      - --mysqld.address=mysql-replica:3306
      - --mysqld.username=root
    depends_on:
      mysql-replica:
        condition: service_healthy

  kafka_exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    container_name: seckill_kafka_exporter
    profiles: ["monitoring"]
    command:
      - --kafka.server=kafka:9092
      - --web.listen-address=:9308
    depends_on:
      kafka:
        condition: service_healthy

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: seckill_cadvisor
    profiles: ["monitoring"]
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  business_exporter:
    build: ./performance/monitoring/business-exporter
    container_name: seckill_business_exporter
    profiles: ["monitoring"]
    environment:
      PERF_PRODUCT_ID: "${PERF_PRODUCT_ID:-900001}"
      PERF_USER_ID_START: "${PERF_USER_ID_START:-9000001}"
      PERF_USER_COUNT: "${PERF_USER_COUNT:-10000}"
      PERF_INITIAL_STOCK: "${PERF_INITIAL_STOCK:-100}"
      PERF_REDIS_RESERVATION_ENABLED: "${PERF_REDIS_RESERVATION_ENABLED:-true}"
      MYSQL_HOST: mysql-primary
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: 418124
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      mysql-primary:
        condition: service_healthy
      redis:
        condition: service_healthy

  k6:
    image: grafana/k6:0.54.0
    container_name: seckill_k6
    profiles: ["loadgen"]
    working_dir: /scripts
    entrypoint: ["k6"]
    volumes:
      - ./performance:/scripts:ro
      - ./performance/reports/runs:/reports

volumes:
  avatar_uploads:
  prometheus_data:
  grafana_data:
