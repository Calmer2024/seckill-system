<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f6f3"><title>压测平台 · 秒杀系统</title><link rel="stylesheet" href="/styles.css"></head>
<body><div class="app-layout">
  <aside class="sidebar" aria-label="平台导航">
    <a class="brand" href="#overview"><span class="brand-mark"><svg><use href="/icons.svg#gauge"></use></svg></span><span><strong>压测平台</strong><small>秒杀系统</small></span></a>
    <nav class="side-nav" aria-label="工作区"><a class="is-current" href="#overview"><svg><use href="/icons.svg#gauge"></use></svg>总览</a><a href="#configure"><svg><use href="/icons.svg#sliders-horizontal"></use></svg>压测配置</a><a href="#current-run"><svg><use href="/icons.svg#pulse"></use></svg>当前任务</a><a href="#history"><svg><use href="/icons.svg#clock-counter-clockwise"></use></svg>运行历史</a><a href="#report"><svg><use href="/icons.svg#chart-line-up"></use></svg>测试报告</a></nav>
    <div class="sidebar-footer"><span id="controller-status" class="connection-status is-checking"><i></i>控制器检查中</span><span>本机压测环境</span></div>
  </aside>
  <div class="main-area"><header class="topbar"><div class="topbar-inner"><span class="breadcrumb">工作区 <span>/</span> 压测总览</span><div class="top-actions"><a href="http://localhost:3000" target="_blank" rel="noreferrer">Grafana<svg><use href="/icons.svg#arrow-square-out"></use></svg></a><a href="http://localhost:9090" target="_blank" rel="noreferrer">Prometheus<svg><use href="/icons.svg#arrow-square-out"></use></svg></a></div></div></header>
  <main class="page-shell" id="overview"><div id="toast" class="toast" role="status" aria-live="polite"></div>
    <section class="page-heading"><div><p class="eyebrow">性能测试 / 工作台</p><h1>压测总览</h1></div><div class="environment-badge"><svg><use href="/icons.svg#shield-check"></use></svg>本机环境</div></section>
    <section class="overview-strip" aria-label="运行概况"><div class="overview-feature"><span class="overview-icon"><svg><use href="/icons.svg#pulse"></use></svg></span><div><span class="overview-label">当前状态</span><strong id="overview-status">待命</strong></div></div><div class="overview-item"><span class="overview-label">最近任务</span><strong id="overview-recent">暂无记录</strong></div><div class="overview-item"><span class="overview-label">运行记录</span><strong id="overview-count">0</strong></div><a class="overview-link" href="#configure">创建任务<svg><use href="/icons.svg#caret-down"></use></svg></a></section>
    <div class="workspace-grid">
      <section class="panel control-panel" id="configure"><div class="panel-heading"><div class="heading-icon"><svg><use href="/icons.svg#sliders-horizontal"></use></svg></div><div><span class="section-index">01 / 配置</span><h2>新建压测</h2></div></div>
        <form id="run-form" novalidate>
          <div class="form-section-label">测试场景</div>
          <div class="field-group"><label id="scenario-label" for="scenario-trigger">场景</label><div class="custom-select" data-select="scenario"><input id="scenario" name="scenario" type="hidden"><button id="scenario-trigger" class="select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="scenario-label scenario-value"><span id="scenario-value">选择场景</span><svg><use href="/icons.svg#caret-down"></use></svg></button><div class="select-menu" role="listbox" aria-labelledby="scenario-label" hidden></div></div><div id="scenario-focus" class="focus-list"></div><p id="scenario-description" class="field-help" hidden></p></div>
          <div class="field-group"><span class="field-label">运行模式</span><div class="segmented-control"><label><input type="radio" name="mode" value="distributed" checked><span>分布式优化</span></label><label><input type="radio" name="mode" value="baseline"><span>基线方案</span></label></div></div>
          <div class="form-section-label with-rule">业务数据</div><div class="field-grid two-columns"><div class="field-group"><label for="product-id">商品 ID</label><input id="product-id" name="product_id" type="text" inputmode="numeric" value="900001" required></div><div class="field-group"><label for="initial-stock">初始库存</label><input id="initial-stock" name="initial_stock" type="text" inputmode="numeric" value="100" required></div><div class="field-group"><label for="user-id-start">用户 ID 起点</label><input id="user-id-start" name="user_id_start" type="text" inputmode="numeric" value="9000001" required></div><div class="field-group"><label for="user-count">用户数量</label><input id="user-count" name="user_count" type="text" inputmode="numeric" value="10000" required></div></div>
          <div class="form-section-label with-rule">执行设置</div><div class="field-grid two-columns"><div class="field-group"><label for="convergence-wait">收敛等待 / 秒</label><input id="convergence-wait" name="convergence_wait_seconds" type="text" inputmode="numeric" value="15" required></div><div class="field-group"><label id="base-url-label" for="base-url-trigger">目标入口</label><div class="custom-select" data-select="base-url"><input id="base-url" name="base_url" type="hidden"><button id="base-url-trigger" class="select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="base-url-label base-url-value"><span id="base-url-value">选择入口</span><svg><use href="/icons.svg#caret-down"></use></svg></button><div class="select-menu" role="listbox" aria-labelledby="base-url-label" hidden></div></div></div><div class="field-group field-wide"><label id="compare-to-label" for="compare-to-trigger">对比基线</label><div class="custom-select" data-select="compare-to"><input id="compare-to" name="compare_to" type="hidden"><button id="compare-to-trigger" class="select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="compare-to-label compare-to-value"><span id="compare-to-value">不生成对比</span><svg><use href="/icons.svg#caret-down"></use></svg></button><div class="select-menu" role="listbox" aria-labelledby="compare-to-label" hidden></div></div></div></div>
          <div class="switch-list"><label class="switch-row"><input id="with-monitoring" type="checkbox" checked><span class="switch-track"></span><strong>采集监控指标</strong></label><label class="switch-row"><input id="skip-reset" type="checkbox"><span class="switch-track"></span><strong>跳过数据准备</strong></label><label class="switch-row"><input id="build-images" type="checkbox"><span class="switch-track"></span><strong>启动前构建镜像</strong></label></div>
          <label class="confirm-row"><input id="confirm-target" type="checkbox"><span class="check-box"><svg><use href="/icons.svg#check"></use></svg></span><span>已确认目标环境获授权，可产生真实压测流量</span></label>
          <div class="form-actions"><button id="start-run" class="button button-primary" type="submit" disabled><svg><use href="/icons.svg#play"></use></svg>启动压测</button><button id="reset-form" class="button button-quiet" type="button">恢复默认</button></div>
        </form>
      </section>
      <div class="right-column"><section class="panel active-panel" id="current-run"><div class="panel-heading"><div class="heading-icon"><svg><use href="/icons.svg#pulse"></use></svg></div><div><span class="section-index">02 / 运行</span><h2>当前任务</h2></div><button id="stop-run" class="button button-danger panel-action" type="button" hidden><svg><use href="/icons.svg#stop"></use></svg>停止任务</button></div><div id="active-run" class="empty-state compact-empty"><svg class="empty-icon"><use href="/icons.svg#pulse"></use></svg><strong>暂无运行任务</strong></div></section>
      <section class="panel history-panel" id="history"><div class="panel-heading"><div class="heading-icon"><svg><use href="/icons.svg#clock-counter-clockwise"></use></svg></div><div><span class="section-index">03 / 记录</span><h2>运行历史</h2></div><button id="refresh-runs" class="icon-button panel-action" type="button" aria-label="刷新运行历史" title="刷新"><svg><use href="/icons.svg#arrow-clockwise"></use></svg></button></div><div class="table-wrap"><table class="runs-table"><thead><tr><th>任务编号</th><th>场景</th><th>模式</th><th>状态</th><th>报告</th></tr></thead><tbody id="runs-body"></tbody></table></div><div id="history-empty" class="empty-state history-empty">暂无运行记录</div></section></div>
    </div>
    <section class="panel report-panel" id="report"><div class="panel-heading report-heading"><div class="heading-icon"><svg><use href="/icons.svg#chart-line-up"></use></svg></div><div><span class="section-index">04 / 分析</span><h2>测试报告</h2></div><div id="report-links" class="report-links"></div></div><div id="report-empty" class="empty-state report-empty"><svg class="empty-icon"><use href="/icons.svg#file-text"></use></svg><strong>选择已完成的任务查看报告</strong></div><div id="report-content" hidden><div id="report-meta" class="report-meta"></div><div id="load-metrics" class="metric-grid"></div><div class="report-columns"><section class="report-section"><div class="section-title">业务结果</div><div id="business-metrics" class="detail-grid"></div></section><section class="report-section"><div class="section-title">一致性校验</div><div id="validation-summary" class="validation-summary"></div><div class="table-wrap validation-wrap"><table class="checks-table"><thead><tr><th>校验项</th><th>状态</th><th>实际值</th><th>期望值</th><th>说明</th></tr></thead><tbody id="checks-body"></tbody></table></div></section></div><section class="report-section observability-section"><div class="section-title">可观测性指标</div><div id="observability-metrics" class="observability-grid"></div></section><section id="comparison-section" class="report-section comparison-section" hidden><div class="section-title">策略对比</div><div class="table-wrap"><table class="comparison-table"><thead><tr><th>指标</th><th>基线</th><th>当前</th><th>改善比例</th><th>方向</th></tr></thead><tbody id="comparison-body"></tbody></table></div></section><div class="raw-report"><button id="raw-report-toggle" class="raw-report-toggle" type="button" aria-expanded="false"><svg><use href="/icons.svg#caret-down"></use></svg>查看原始数据</button><pre id="raw-json" hidden></pre></div></div></section>
  </main></div>
</div><script src="/app.js" defer></script></body></html>
