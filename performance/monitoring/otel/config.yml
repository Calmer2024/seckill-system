extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage:
    directory: /var/lib/otel
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 160
    spike_limit_mib: 32
  batch:
    timeout: 1s
    send_batch_size: 256
    send_batch_max_size: 512
  transform/privacy:
    error_mode: propagate
    trace_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.namespace", "service.version", "service.instance.id", "deployment.environment.name"])
      - context: span
        statements:
          - keep_keys(attributes, ["http.method", "http.request.method", "http.route", "http.status_code", "http.response.status_code", "db.system", "db.system.name", "db.name", "db.namespace", "db.operation", "db.operation.name", "server.address", "server.port", "net.peer.name", "net.peer.port", "seckill.outcome", "seckill.error_code", "messaging.system", "messaging.destination.name", "messaging.operation.type", "messaging.message.id", "messaging.consumer.group.name", "messaging.kafka.partition", "messaging.kafka.offset", "seckill.order_id", "seckill.attempt", "seckill.product_id", "seckill.campaign_id", "seckill.quantity", "seckill.request_id", "seckill.business_state", "seckill.entity", "seckill.causation_id", "seckill.queue_wait_ms", "seckill.mode", "exception.type", "seckill.result_count", "seckill.page", "seckill.page_size", "seckill.available_stock", "seckill.reserved_stock", "seckill.sold_stock", "db.query.fingerprint"])
          - set(status.message, "")
          - replace_pattern(name, " .*", "") where attributes["db.system"] != nil or attributes["db.system.name"] != nil
          - replace_pattern(attributes["db.operation"], " .*", "") where attributes["db.operation"] != nil
      - context: spanevent
        statements:
          - keep_keys(attributes, ["exception.type", "seckill.order_id", "seckill.product_id", "seckill.quantity", "seckill.entity", "seckill.business_state", "seckill.outcome", "seckill.error_code", "messaging.kafka.partition"])
exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    timeout: 2s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 256
      storage: file_storage
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 60s
service:
  extensions: [health_check, file_storage]
  telemetry:
    metrics:
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/privacy, batch]
      exporters: [otlp/tempo]
