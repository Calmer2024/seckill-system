global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: product_service
    metrics_path: /metrics
    static_configs:
      - targets:
          - product_service_1:8000
          - product_service_2:8000

  - job_name: order_service
    metrics_path: /metrics
    static_configs:
      - targets:
          - order_service:8000

  - job_name: inventory_service
    metrics_path: /metrics
    static_configs:
      - targets:
          - inventory_service:8000

  - job_name: user_service
    metrics_path: /metrics
    static_configs:
      - targets:
          - user_service:8000

  - job_name: redis
    static_configs:
      - targets:
          - redis_exporter:9121

  - job_name: mysql
    static_configs:
      - targets:
          - mysqld_exporter:9104

  - job_name: mysql_replica
    static_configs:
      - targets:
          - mysqld_replica_exporter:9104

  - job_name: kafka
    static_configs:
      - targets:
          - kafka_exporter:9308

  - job_name: containers
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: business
    static_configs:
      - targets:
          - business_exporter:9105
