global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alert_relabel_configs:
    - target_label: environment
      replacement: local
    - target_label: notification_owner
      replacement: platform
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: alert_receiver
    static_configs:
      - targets: [alert-receiver:9122]
        labels: {service: alert-receiver, environment: local}
  - job_name: business_audit
    static_configs:
      - targets: [business-audit:9124]
        labels: {service: business-audit, environment: local}
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: loki
    static_configs:
      - targets: [loki:3100]
  - job_name: alloy
    static_configs:
      - targets: [alloy:12345]
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
  - job_name: product_service
    metrics_path: /metrics
    static_configs:
      - targets:
          - product_service_1:8000
          - product_service_2:8000

  - job_name: order_service
    metrics_path: /metrics
    static_configs:
      - targets:
          - order_service:8000

  - job_name: inventory_service
    metrics_path: /metrics
    static_configs:
      - targets:
          - inventory_service:8000

  - job_name: order_worker
    static_configs:
      - targets: [order_worker:9106]
        labels:
          service: order-worker
          environment: local

  - job_name: inventory_worker
    static_configs:
      - targets: [inventory_worker:9106]
        labels:
          service: inventory-worker
          environment: local

  - job_name: user_service
    metrics_path: /metrics
    static_configs:
      - targets:
          - user_service:8000

  - job_name: redis
    static_configs:
      - targets:
          - redis_exporter:9121

  - job_name: mysql
    static_configs:
      - targets:
          - mysqld_exporter:9104

  - job_name: mysql_replica
    static_configs:
      - targets:
          - mysqld_replica_exporter:9104

  - job_name: kafka
    static_configs:
      - targets:
          - kafka_exporter:9308

  - job_name: containers
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: business
    static_configs:
      - targets:
          - business_exporter:9105

  - job_name: otel_collector
    static_configs:
      - targets: [otel-collector:8888]
        labels: {service: otel-collector, environment: local}

  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]
        labels: {service: tempo, environment: local}
