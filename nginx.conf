worker_processes auto;

events {
    # 把每个工人的最大连接数从 1024 提升到 4096 甚至更高
    worker_connections 4096;
    # 允许一个工人一次性接受多个排队的新连接，极大提升瞬间洪峰的吞吐量
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    resolver 127.0.0.11 ipv6=off valid=30s;
    resolver_timeout 5s;

    # Finite route families; query strings and credentials are not logged.
    map $uri $observability_route {
        default "static_or_unmatched";
        ~^/api/users "/api/users/*";
        ~^/api/products "/api/products/*";
        ~^/api/orders "/api/orders/*";
        ~^/api/inventory "/api/inventory/*";
    }
    map $upstream_http_x_trace_id $observability_trace_id {
        default "";
        "~^[0-9a-f]{32}$" $upstream_http_x_trace_id;
    }
    log_format observability escape=json
        '{"timestamp":"$time_iso8601","level":"INFO","service":"gateway",'
        '"event":"http_access","request_id":"$request_id","trace_id":"$observability_trace_id","route_template":"$observability_route",'
        '"method":"$request_method","status_code":$status,"duration_seconds":$request_time,'
        '"upstream":"$upstream_addr","upstream_status":"$upstream_status","upstream_seconds":"$upstream_response_time"}';
    access_log /dev/stdout observability;
    error_log /dev/stderr warn;

    # ================= 作业核心：负载均衡 =================
    # 定义商品服务的服务器集群 (高并发读核心)
    upstream product_backend {
        zone product_backend 64k;
        # 默认使用轮询 (Round Robin) 算法。
        # 如果你想向老师展示更高级的算法，可以去掉下面一行的注释：
        # least_conn;  # 把请求发给当前排队人数最少的实例

        server seckill_product_1:8000 resolve;
        server seckill_product_2:8000 resolve;
    }

    # 定义用户服务的服务器 (低并发，单实例即可)
    upstream user_backend {
        zone user_backend 64k;
        server seckill_user:8000 resolve;
    }

    # 定义订单服务服务器
    upstream order_backend {
        zone order_backend 64k;
        server seckill_order_service:8000 resolve;
    }

    upstream inventory_backend {
        zone inventory_backend 64k;
        server seckill_inventory_service:8000 resolve;
    }
    # ====================================================

    server {
        listen 80;
        server_name localhost;

        # 1. 动静分离：前端静态资源
        # 匹配根路径，直接从 Nginx 内部的硬盘读取文件，速度极快，完全不打扰 Python
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            # 解决 React Router 单页应用刷新报 404 的问题
            try_files $uri $uri/ /index.html;
        }

        # 2. 动静分离：用户服务接口转发
        # 注意：去掉了末尾的斜杠，保证 /api/users 和 /api/users/xxx 都能匹配
        location /api/users {
            proxy_pass http://user_backend;
            proxy_set_header X-Request-ID $request_id;
            # Public ingress starts a new trace; internal httpx hops propagate W3C context.
            proxy_set_header traceparent "";
            proxy_set_header tracestate "";
            proxy_set_header baggage "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 3. 动静分离：商品服务接口转发 (带有负载均衡)
        # 注意：去掉了末尾的斜杠
        location /api/products {
            proxy_pass http://product_backend;
            proxy_set_header X-Request-ID $request_id;
            # Public ingress starts a new trace; internal httpx hops propagate W3C context.
            proxy_set_header traceparent "";
            proxy_set_header tracestate "";
            proxy_set_header baggage "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 4. 秒杀订单接口转发
        location /api/orders {
            proxy_pass http://order_backend;
            proxy_set_header X-Request-ID $request_id;
            # Public ingress starts a new trace; internal httpx hops propagate W3C context.
            proxy_set_header traceparent "";
            proxy_set_header tracestate "";
            proxy_set_header baggage "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 5. 库存查询接口转发
        location /api/inventory {
            proxy_pass http://inventory_backend;
            proxy_set_header X-Request-ID $request_id;
            # Public ingress starts a new trace; internal httpx hops propagate W3C context.
            proxy_set_header traceparent "";
            proxy_set_header tracestate "";
            proxy_set_header baggage "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
